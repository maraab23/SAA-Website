<!-- SAA favicons (added via _quarto.yml: format: html: include-in-header).
     Paths are built relative to the site root using Quarto's "quarto:offset" meta tag,
     so the site works both at a domain root and under a subpath (e.g. user.github.io/repo/).
     The SVG favicon itself is set by website: favicon. -->
<meta name="theme-color" content="#0F1F3A">
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var meta = document.querySelector('meta[name="quarto:offset"]');
    var root = meta ? meta.getAttribute("content") : "./";
    [["icon", "favicons/favicon.ico", "48x48"],
     ["apple-touch-icon", "favicons/apple-touch-icon.png"],
     ["manifest", "favicons/site.webmanifest"]].forEach(function (l) {
      var link = document.createElement("link");
      link.rel = l[0];
      link.href = root + l[1];
      if (l[2]) link.sizes = l[2];
      document.head.appendChild(link);
    });
  });
</script>
